# Consumer caller: Protected Paths (detect)
#
# MINIMAL FOOTPRINT: this repo carries NO guard scripts or logic. All detection
# lives in central-linter's reusable workflow, referenced below. This is the
# entire per-repo cost (this file + the comment caller + optional config).
#
# Pinned to the PR branch for E2E validation; real consumers use @v1.

name: Protected Paths (detect)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    uses: opendatahub-io/central-linter/.github/workflows/protected-paths-detect.yml@aipcc-18022-protected-paths-guard
    with:
      config: .github/protected-paths.yml
      central-ref: aipcc-18022-protected-paths-guard
