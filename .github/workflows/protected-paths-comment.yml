# Consumer caller: Protected Paths (comment)
#
# MINIMAL FOOTPRINT: no scripts/logic here. Calls central-linter's reusable
# comment workflow. Fork-safe: runs on workflow_run (privileged) and only
# consumes the sanitized artifact produced by the unprivileged detect stage.
#
# Pinned to the PR branch for E2E validation; real consumers use @v1.

name: Protected Paths (comment)

on:
  workflow_run:
    workflows: ["Protected Paths (detect)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    uses: opendatahub-io/central-linter/.github/workflows/protected-paths-comment.yml@aipcc-18022-protected-paths-guard
    with:
      run-id: ${{ github.event.workflow_run.id }}
      central-ref: aipcc-18022-protected-paths-guard
    secrets: inherit
